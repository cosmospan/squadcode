# Peek steering one bot's message to another (brain/talk.rs).
#
# Each case is one bot-to-bot message. Peek's real engine reads it and decides;
# the case passes when the decision matches one of its `ok` outcomes.
#
#   id      unique, "area.what"; the area is the part before the dot
#   from    where the case came from
#   asked   what the person last asked in the thread
#   since   what was said since, oldest first, as [who, words]
#   sender, to   the bot sending the message and the bot it's for
#   says    the message
#   hops    bot-to-bot messages since the person spoke; last = the limit is reached
#   crew    all | no-guard | starter | all+stripe (all+stripe here by default)
#   ok      the right outcomes; any one passes:
#             do  pass | drop | stop
#             to  for pass: any of these bots
#   gap     why the case is known to fail today, and what fixes it
#
# Seeded from the 30 scenes of PR 132 (300 runs on haiku, 90 on sonnet).

[[case]]
