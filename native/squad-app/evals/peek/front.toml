# Peek reading a message the person sends (brain/think.rs).
#
# Each case is one moment in a thread. Peek's real engine reads it and decides;
# the case passes when the decision matches one of its `ok` outcomes.
#
#   id      unique, "area.what"; the area is the part before the dot
#   from    where the case came from
#   thread  the thread's name (without #); crew: all | no-guard | starter | all+stripe
#   open    bots with an open job in this thread
#   said    the conversation so far, oldest first, as [who, words]
#   picked  "Do" or "Ask" when the person used the box's chips
#   wrote   what the person just wrote
#   ok      the right outcomes; any one passes:
#             do        reply | ask | stop | run | answer | hand | confirm | make
#             bot       for hand/confirm/answer/make: any of these names
#                       ("Peek" for an answer Peek gives itself)
#             start     for make: whether the work starts once it's made
#             name      for make: any of these names
#             task_has  the decision's whole ask holds a word from each group
#             title_not the job's title is none of these
#   never   bots that must never get it, whatever `ok` says
#   gap     why the case is known to fail today, and what fixes it

